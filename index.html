<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat Marker Pro Web</title><link rel="stylesheet" href="css/style.css"></head><body><main><header><div><h1>Beat Marker Pro</h1><p>Automatic audio beat markers — runs locally in your browser.</p></div><span>FREE • LOCAL</span></header><section class="card upload"><input id="file" type="file" accept="audio/*"><label for="file"><b>Choose an audio file</b><small>MP3, WAV, M4A, AAC and browser-supported audio</small></label><p id="fileInfo">No audio selected.</p></section><section class="card"><div class="grid"><label>Frame timing<select id="fps"><option value="none">None — exact beat time</option><option value="23.976">23.976 fps</option><option value="29.97" selected>29.97 fps</option><option value="59.94">59.94 fps</option></select></label><label>Sensitivity<select id="sensitivity"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label>Min BPM<input id="minBpm" type="number" value="70"></label><label>Max BPM<input id="maxBpm" type="number" value="180"></label><label>Offset (sec)<input id="offset" type="number" step=".001" value="0"></label><label>Marker label<input id="label" value="Beat"></label></div><button id="analyze" disabled>MARK TIMELINE AUTOMATICALLY</button><button id="clear">Clear markers</button></section><section class="card"><div class="stats"><div>BPM<b id="bpm">—</b></div><div>Markers<b id="count">0</b></div><div>Duration<b id="duration">—</b></div></div><canvas id="timeline" height="150"></canvas><audio id="player" controls></audio></section><section class="card"><h2>Export</h2><button id="csv" disabled>Download CSV</button><button id="json" disabled>Download JSON</button><button id="edl" disabled>Download Premiere Marker CSV</button><p>Audio is analyzed locally; it is not uploaded.</p></section><div id="status">Choose an audio file to begin.</div><footer>Beat Marker Pro Web v1.0 • Browser-only</footer></main><script src="js/app.js"></script></body></html>
